name: collect-signals

# 실데이터 수집은 KRX/야후 등 외부 접근이 되는 GitHub Actions 러너에서 실행한다.
# (Claude Code 원격 세션은 KRX 도메인이 차단되어 pykrx 가 동작하지 않음)

on:
  workflow_dispatch:        # 수동 실행(첫 리포트 검증용)
    inputs:
      start:
        description: "수집 시작일 (YYYY-MM-DD)"
        default: "2024-01-01"
  schedule:
    - cron: "40 6 * * 1-5"  # 평일 KST 15:40 (UTC 06:40) — 장 마감 후

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r analysis/requirements.txt pykrx

      - name: Run orchestrator (실데이터)
        run: |
          python orchestrator.py \
            --start "${{ github.event.inputs.start || '2024-01-01' }}" \
            --db reports/market.sqlite \
            --out reports

      - name: Upload report + db
        uses: actions/upload-artifact@v4
        with:
          name: signals-${{ github.run_number }}
          path: |
            reports/signal_report.md
            reports/market.sqlite
          if-no-files-found: warn
